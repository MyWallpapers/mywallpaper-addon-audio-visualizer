[package]
name = "mywallpaper-audio-visualizer-companion"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
windows = { version = "0.62.2", features = [
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }
