name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: audio-visualizer-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { persist-credentials: false }
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24 }
      - name: Enable pinned pnpm
        run: corepack enable pnpm
      - name: Install, typecheck and build
        run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm build

  native:
    name: native-x64-and-arm64
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout add-on without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { path: addon, persist-credentials: false }
      - name: Checkout the exact trusted toolchain
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: MyWallpapers/native-addon-toolchain
          ref: 6016d530eeddac9eddf8ec17a27f2a1727e847c8
          path: toolchain
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version-file: toolchain/.nvmrc }
      - name: Build both declared companion architectures
        shell: pwsh
        run: |
          node toolchain/.github/scripts/build-native-companions.mjs `
            --repository-root addon `
            --output-root "$env:RUNNER_TEMP/mywallpaper-companion-output"
